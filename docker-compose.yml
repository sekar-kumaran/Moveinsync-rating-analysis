version: "3.9"

services:
  # ── Dashboard ────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: moveinsync-fde:latest
    container_name: moveinsync_dashboard
    ports:
      - "8501:8501"
    volumes:
      # Mount data so it persists and can be refreshed
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
      - ./deliverables:/app/deliverables
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Pipeline runner (one-shot) ────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: moveinsync-fde:latest
    container_name: moveinsync_pipeline
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        echo '=== Starting MoveInSync Review Pipeline ===' &&
        python src/collect_reviews.py --app-id com.moveinsync.ets --lang en --country in --count 3000 &&
        python src/clean_reviews.py &&
        python src/classify_reviews.py &&
        python src/analyze_reviews.py &&
        python src/build_dashboard_data.py &&
        echo '=== Pipeline complete. Restart the dashboard container to see updated data. ==='
      "
    profiles:
      - pipeline   # only runs with: docker compose --profile pipeline up pipeline

  # ── Jupyter Lab (for notebooks) ──────────────────────────
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: moveinsync-fde:latest
    container_name: moveinsync_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./notebooks:/app/notebooks
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        pip install jupyterlab -q &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --NotebookApp.token='' --NotebookApp.password=''
      "
    profiles:
      - jupyter   # only runs with: docker compose --profile jupyter up jupyter
